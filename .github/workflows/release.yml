name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Fail fast if signing secrets are missing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::Release signing secrets are not configured."
          echo "::error::Add the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (repo Settings → Secrets and variables → Actions), then re-run this workflow."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" > /dev/null

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.p12"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release-keystore.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          rm -f /tmp/gradle-build.log
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee -a /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK: $APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          ASSET="IndianNutritionTracker-${TAG}.apk"
          cp "$APK" "$ASSET"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists — uploading the APK as an asset"
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --title "Indian Nutrition Tracker ${TAG}" --generate-notes
          fi
