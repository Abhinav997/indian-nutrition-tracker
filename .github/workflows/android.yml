name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" > /dev/null

      - name: Compile debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee /tmp/gradle.log
          exit ${PIPESTATUS[0]}

      - name: Run unit tests
        run: |
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee -a /tmp/gradle.log
          exit ${PIPESTATUS[0]}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Temporary: surfaces build logs on GH branch (sandbox can't read GH logs)
      - name: Capture build log on failure
        if: failure()
        run: |
          set +e
          cat /tmp/gradle.log 2>/dev/null > .ci-build-error.log
          [ -s .ci-build-error.log ] || echo "no captured output" > .ci-build-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ci-build-error.log
          git commit -q -m "ci: capture build error log [skip ci]" || true
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" || true
