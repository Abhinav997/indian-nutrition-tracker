name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" > /dev/null

      - name: Compile debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests (calculator)
        run: ./gradlew :app:testDebugUnitTest --tests "*TargetCalculatorTest" --stacktrace

      - name: Run unit tests (dates)
        run: ./gradlew :app:testDebugUnitTest --tests "*DateUtilsTest" --stacktrace

      - name: Run unit tests (units)
        run: ./gradlew :app:testDebugUnitTest --tests "*UnitConvertersTest" --stacktrace

      - name: Run unit tests (settings)
        run: ./gradlew :app:testDebugUnitTest --tests "*SettingsRepositoryTest" --stacktrace
      - name: Run unit tests (food lookup)
        run: ./gradlew :app:testDebugUnitTest --tests "*FoodLookupTest" --stacktrace

      - name: Run unit tests (off cache)
        run: ./gradlew :app:testDebugUnitTest --tests "*OffCacheRepositoryTest" --stacktrace

      - name: Run unit tests (weight repo)
        run: ./gradlew :app:testDebugUnitTest --tests "*WeightRepositoryTest" --stacktrace

      - name: Run unit tests (off parser)
        run: ./gradlew :app:testDebugUnitTest --tests "*OffProductParserTest" --stacktrace

      - name: Run unit tests (off client)
        run: ./gradlew :app:testDebugUnitTest --tests "*OffApiClientTest" --stacktrace

      - name: Run unit tests (off search)
        run: ./gradlew :app:testDebugUnitTest --tests "*OffSearchRepositoryTest" --stacktrace

      - name: Run unit tests (chart math)
        run: ./gradlew :app:testDebugUnitTest --tests "*ChartMathTest" --stacktrace

      - name: Run unit tests (number utils)
        run: ./gradlew :app:testDebugUnitTest --tests "*NumberUtilsTest" --stacktrace

      - name: Run unit tests (csv export)
        run: ./gradlew :app:testDebugUnitTest --tests "*CsvExporterTest" --stacktrace

      - name: Run unit tests (json backup)
        run: ./gradlew :app:testDebugUnitTest --tests "*JsonBackupTest" --stacktrace


      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" > /dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
