name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" > /dev/null

      - name: Compile debug APK
        run: |
          rm -f /tmp/gradle-build.log
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee -a /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Run unit tests (calculator)
        run: |
          ./gradlew :app:testDebugUnitTest --tests "*TargetCalculatorTest" --stacktrace 2>&1 | tee -a /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Run unit tests (dates)
        run: |
          ./gradlew :app:testDebugUnitTest --tests "*DateUtilsTest" --stacktrace 2>&1 | tee -a /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Run unit tests (units)
        run: |
          ./gradlew :app:testDebugUnitTest --tests "*UnitConvertersTest" --stacktrace 2>&1 | tee -a /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Run unit tests (settings)
        run: |
          ./gradlew :app:testDebugUnitTest --tests "*SettingsRepositoryTest" --stacktrace 2>&1 | tee -a /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}
      - name: Run unit tests (food lookup)
        run: |
          ./gradlew :app:testDebugUnitTest --tests "*FoodLookupTest" --stacktrace 2>&1 | tee -a /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Run unit tests (off cache)
        run: |
          ./gradlew :app:testDebugUnitTest --tests "*OffCacheRepositoryTest" --stacktrace 2>&1 | tee -a /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Run unit tests (weight repo)
        run: |
          ./gradlew :app:testDebugUnitTest --tests "*WeightRepositoryTest" --stacktrace 2>&1 | tee -a /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Run unit tests (off parser)
        run: |
          ./gradlew :app:testDebugUnitTest --tests "*OffProductParserTest" --stacktrace 2>&1 | tee -a /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Run unit tests (off client)
        run: |
          ./gradlew :app:testDebugUnitTest --tests "*OffApiClientTest" --stacktrace 2>&1 | tee -a /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Run unit tests (off search)
        run: |
          ./gradlew :app:testDebugUnitTest --tests "*OffSearchRepositoryTest" --stacktrace 2>&1 | tee -a /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Run unit tests (chart math)
        run: |
          ./gradlew :app:testDebugUnitTest --tests "*ChartMathTest" --stacktrace 2>&1 | tee -a /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Run unit tests (number utils)
        run: |
          ./gradlew :app:testDebugUnitTest --tests "*NumberUtilsTest" --stacktrace 2>&1 | tee -a /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Run unit tests (csv export)
        run: |
          ./gradlew :app:testDebugUnitTest --tests "*CsvExporterTest" --stacktrace 2>&1 | tee -a /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Run unit tests (json backup)
        run: |
          ./gradlew :app:testDebugUnitTest --tests "*JsonBackupTest" --stacktrace 2>&1 | tee -a /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}


      - name: Capture build log (on failure)
        if: failure()
        run: |
          cp /tmp/gradle-build.log .ci-build-error.log
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$GITHUB_REF_NAME" || true
            git rebase -q "origin/$GITHUB_REF_NAME" >/dev/null 2>&1 || true
            git add -f .ci-build-error.log
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "ci: capture build error log [skip ci]" >/dev/null 2>&1 || true
            git push origin "HEAD:$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
            sleep 10
          done
          exit 1

      - name: Upload gradle log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" > /dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --stacktrace 2>&1 | tee /tmp/gradle-instr.log
            exit ${PIPESTATUS[0]}

      - name: Capture instrumentation log (on failure)
        if: failure()
        run: |
          cp /tmp/gradle-instr.log .ci-build-error.log
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$GITHUB_REF_NAME" || true
            git rebase -q "origin/$GITHUB_REF_NAME" >/dev/null 2>&1 || true
            git add -f .ci-build-error.log
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "ci: capture instrumented log [skip ci]" >/dev/null 2>&1 || true
            git push origin "HEAD:$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
            sleep 10
          done
          exit 1

      - name: Upload instrumentation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-instrumented-log
          path: /tmp/gradle-instr.log
          if-no-files-found: ignore

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
